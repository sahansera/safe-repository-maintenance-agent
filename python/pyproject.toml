[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-repository-agent"
version = "0.1.0"
description = "A permission-gated repository maintenance agent built with GitHub Copilot and Microsoft Agent Framework"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-github-copilot==1.0.1",
  "github-copilot-sdk==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
safe-repo-agent = "safe_repository_agent.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

